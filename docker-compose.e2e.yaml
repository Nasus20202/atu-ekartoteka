# Stack used by the E2E workflow: the production image plus its database.
# CI:    docker compose -f docker-compose.e2e.yaml up --no-build --wait
# Local: docker compose -f docker-compose.e2e.yaml up --build --wait
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e2e_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d e2e_test']
      interval: 5s
      timeout: 5s
      retries: 10

  ekartoteka:
    image: ekartoteka:e2e
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS_ON_STARTUP: 'true'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/e2e_test
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@db:5432/e2e_test
      AUTH_SECRET: e2e-test-secret-key-for-nextauth-sessions
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
      # Disable Turnstile and SMTP for E2E tests
      TURNSTILE_SITE_KEY: ''
      TURNSTILE_SECRET_KEY: ''
      SMTP_HOST: ''
      # Lets visual tests freeze the date with the x-e2e-fixed-now header
      E2E_ALLOW_FIXED_NOW: 'true'
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health/readiness || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
