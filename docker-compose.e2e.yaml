# Stack used by the E2E workflows: the production image run three times.
# `ekartoteka` serves the functional suite (port 3000, database e2e),
# `ekartoteka-visual` the visual suite (port 3001, database e2e_visual) and
# `ekartoteka-integrations` the integration suite (port 3002, database e2e),
# which talks to the local `mocks` service (SMTP, Google OIDC, Turnstile).
# `mocks` is built from docker/Dockerfile.mocks (same Node image as the app).
# CI:    docker compose -f docker-compose.e2e.yaml up --no-build --wait
# Local: docker compose -f docker-compose.e2e.yaml up --build --wait
x-app-common: &app-common
  image: ekartoteka:e2e
  depends_on:
    db:
      condition: service_healthy
  environment: &app-common-environment
    NODE_ENV: production
    RUN_MIGRATIONS_ON_STARTUP: 'true'
    AUTH_SECRET: e2e-test-secret-key-for-nextauth-sessions
    AUTH_TRUST_HOST: 'true'
    # Disable Turnstile and SMTP for E2E tests
    TURNSTILE_SITE_KEY: ''
    TURNSTILE_SECRET_KEY: ''
    SMTP_HOST: ''
    # Lets visual tests freeze the date with the x-e2e-fixed-now header
    E2E_ALLOW_FIXED_NOW: 'true'
  healthcheck:
    test:
      [
        'CMD-SHELL',
        'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health/readiness || exit 1',
      ]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e2e
    volumes:
      # Creates the visual database next to `e2e` on first start
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d e2e']
      interval: 5s
      timeout: 5s
      retries: 10

  ekartoteka:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-common-environment
      DATABASE_URL: postgresql://postgres:postgres@db:5432/e2e
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@db:5432/e2e
      AUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'

  ekartoteka-visual:
    <<: *app-common
    # Built by the `ekartoteka` service; the same image is reused
    pull_policy: never
    environment:
      <<: *app-common-environment
      DATABASE_URL: postgresql://postgres:postgres@db:5432/e2e_visual
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@db:5432/e2e_visual
      AUTH_URL: http://localhost:3001
      # Only makes the login page show the Google button; the flow is never started
      GOOGLE_CLIENT_ID: visual-google-client-id
      GOOGLE_CLIENT_SECRET: visual-google-client-secret
    ports:
      - '3001:3000'

  mocks:
    image: ekartoteka-mocks:e2e
    build:
      context: .
      dockerfile: docker/Dockerfile.mocks
    ports:
      - '4010:4010'
      - '1025:1025'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  ekartoteka-integrations:
    <<: *app-common
    # Built by the `ekartoteka` service; the same image is reused
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
      ekartoteka:
        condition: service_healthy
      mocks:
        condition: service_healthy
    environment:
      <<: *app-common-environment
      # `ekartoteka` already migrated the shared `e2e` database
      RUN_MIGRATIONS_ON_STARTUP: 'false'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/e2e
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@db:5432/e2e
      AUTH_URL: http://localhost:3002
      APP_URL: http://localhost:3002
      EMAIL_FROM: noreply@ekartoteka.test
      SMTP_HOST: mocks
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      TURNSTILE_SITE_KEY: mock-site-key
      TURNSTILE_SECRET_KEY: mock-secret-key
      TURNSTILE_VERIFY_URL: http://mocks:4010/turnstile/siteverify
      GOOGLE_CLIENT_ID: mock-google-client-id
      GOOGLE_CLIENT_SECRET: mock-google-client-secret
      GOOGLE_ISSUER_URL: http://mocks:4010/google
    ports:
      - '3002:3000'
