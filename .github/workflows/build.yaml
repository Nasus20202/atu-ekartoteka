name: Build Docker Image

on:
  workflow_call:

jobs:
  build:
    name: App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms:
            ${{ (github.event_name == 'pull_request') && 'linux/amd64' ||
            'linux/amd64,linux/arm64' }}
          build-args: DEPLOYMENT_ID=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/ekartoteka-image.tar
          cache-from: |
            type=gha,scope=build-${{ github.event_name == 'pull_request' && 'amd64' || 'multi' }}
            type=gha,scope=build-multi
          cache-to: type=gha,scope=build-${{ github.event_name == 'pull_request' && 'amd64' || 'multi' }},mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}/ekartoteka-image.tar
          retention-days: 1
          compression-level: 1

  build-mocks:
    name: Mocks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build mock services image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.mocks
          platforms: linux/amd64
          tags: ekartoteka-mocks:e2e
          outputs: type=docker,dest=${{ runner.temp }}/ekartoteka-mocks-image.tar
          cache-from: type=gha,scope=build-mocks
          cache-to: type=gha,scope=build-mocks,mode=max

      - name: Upload mock services image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ekartoteka-mocks-image
          path: ${{ runner.temp }}/ekartoteka-mocks-image.tar
          retention-days: 1
          compression-level: 1
