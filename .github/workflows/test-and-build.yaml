name: Test & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scan:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    uses: ./.github/workflows/security-scan.yaml

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '12.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dbname
        run: pnpm db:generate

      - name: Restore lint and type cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache
            tsconfig.tsbuildinfo
          key: lint-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            lint-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            lint-cache-${{ runner.os }}-

      - name: Run ESLint
        run: pnpm lint --cache --cache-location .cache/eslint/

      - name: Check formatting
        run: pnpm format:check --cache --cache-location .cache/prettier

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage report for changed files
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        with:
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
          vite-config-path: './vitest.config.ts'
          file-coverage-mode: 'changes'

      - name: Run TypeScript compiler
        run: pnpm tsc

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms:
            ${{ (github.event_name == 'pull_request') && 'linux/amd64' ||
            'linux/amd64,linux/arm64' }}
          outputs: type=oci,dest=${{ runner.temp }}/ekartoteka-image.tar
          cache-from: |
            type=gha,scope=build-${{ github.event_name == 'pull_request' && 'amd64' || 'multi' }}
            type=gha,scope=build-multi
          cache-to: type=gha,scope=build-${{ github.event_name == 'pull_request' && 'amd64' || 'multi' }},mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}/ekartoteka-image.tar
          retention-days: 1
          compression-level: 1

  e2e:
    name: E2E Tests
    needs: [build]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@localhost:5432/e2e_test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" \
            docker-daemon:ekartoteka:e2e

      - name: Start application and database
        run: docker compose -f docker-compose.e2e.yaml up --no-build --wait --wait-timeout 180

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '12.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests against the Docker image
        run: pnpm exec playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'

      - name: Show application logs
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yaml ps
          docker inspect --format '{{json .State.Health}}' "$(docker compose -f docker-compose.e2e.yaml ps -q ekartoteka)" || true
          docker compose -f docker-compose.e2e.yaml logs

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  performance:
    name: Performance Tests
    needs: [build]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" \
            docker-daemon:ekartoteka:e2e

      - name: Start application and database
        run: docker compose -f docker-compose.e2e.yaml up --no-build --wait --wait-timeout 180

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '12.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed test data
        run: pnpm exec tsx e2e/utils/seed-test-data.ts

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          # renovate: datasource=github-releases depName=grafana/k6 extractVersion=^v(?<version>.+)$
          k6-version: '2.3.0'

      - name: Run performance tests
        run: mkdir -p perf-results && k6 run perf/load-test.js
        env:
          PERF_BASE_URL: http://localhost:3000

      - name: Publish performance summary
        if: always()
        run: cat perf-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Show application logs
        if: failure()
        # The tail keeps the k6 summary above readable
        run: docker compose -f docker-compose.e2e.yaml logs --tail 200 ekartoteka

      - name: Upload performance results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: performance-results
          path: perf-results/
          retention-days: 14

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" \
            docker-daemon:ekartoteka:e2e

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ekartoteka:e2e
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy container results
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-container'

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, lint-and-test, e2e, performance, container-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $TAGS; do
            skopeo copy --all --dest-creds "$REGISTRY_CREDS" \
              "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" "docker://$tag"
          done
