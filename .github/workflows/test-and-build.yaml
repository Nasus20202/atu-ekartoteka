name: Test & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.14.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dbname
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage report for changed files
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: './coverage/coverage-summary.json'
          json-final-path: './coverage/coverage-final.json'
          vite-config-path: './vitest.config.ts'
          file-coverage-mode: 'changes'

      - name: Run TypeScript compiler
        run: pnpm tsc

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms:
            ${{ (github.event_name == 'pull_request') && 'linux/amd64' ||
            'linux/amd64,linux/arm64' }}
          outputs: type=oci,dest=${{ runner.temp }}/ekartoteka-image.tar
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}/ekartoteka-image.tar
          retention-days: 1
          compression-level: 1

  e2e:
    name: E2E Tests
    needs: [build]
    uses: ./.github/workflows/e2e.yaml

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $TAGS; do
            skopeo copy --all --dest-creds "$REGISTRY_CREDS" \
              "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" "docker://$tag"
          done
