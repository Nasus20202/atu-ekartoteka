name: Test & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    uses: ./.github/workflows/security-scan.yaml

  lint-and-test:
    name: Lint & Test
    permissions:
      pull-requests: write
    uses: ./.github/workflows/lint-and-test.yaml

  build:
    name: Build Docker Image
    uses: ./.github/workflows/build.yaml

  e2e:
    name: E2E Tests
    needs: [build]
    uses: ./.github/workflows/e2e.yaml

  performance:
    name: Performance Tests
    needs: [build]
    uses: ./.github/workflows/performance.yaml

  container-scan:
    name: Container Scan
    needs: [build]
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-scan.yaml

  publish:
    name: Publish Docker Image
    needs: [security-scan, lint-and-test, e2e, performance, container-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yaml
