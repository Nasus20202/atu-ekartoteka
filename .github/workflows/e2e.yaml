name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
  DATABASE_REPLICA_URLS: postgresql://postgres:postgres@localhost:5432/e2e_test
  AUTH_SECRET: e2e-test-secret-key-for-nextauth-sessions
  NEXTAUTH_URL: http://localhost:3000

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ekartoteka:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start application container
        run: |
          docker run -d --name ekartoteka --network host \
            -e NODE_ENV=production \
            -e RUN_MIGRATIONS_ON_STARTUP=true \
            -e DATABASE_URL \
            -e DATABASE_REPLICA_URLS \
            -e AUTH_SECRET \
            -e NEXTAUTH_URL \
            -e AUTH_TRUST_HOST=true \
            -e TURNSTILE_SITE_KEY= \
            -e TURNSTILE_SECRET_KEY= \
            -e SMTP_HOST= \
            ekartoteka:e2e

      - name: Wait for application to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ekartoteka)" != "true" ]; then
              echo "Container exited before becoming healthy"
              break
            fi
            sleep 2
          done
          docker logs ekartoteka
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.14.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests against the Docker image
        run: pnpm exec playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'

      - name: Show application logs
        if: failure()
        run: docker logs ekartoteka

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
