name: E2E Tests

on:
  workflow_call:

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: >-
              --project=chromium --project=chromium-mobile
              --project=chromium-admin --project=chromium-integrations
              --project=visual-desktop --project=visual-mobile
          - browser: firefox
            projects: >-
              --project=firefox --project=firefox-admin
              --project=firefox-mobile
          - browser: webkit
            projects: >-
              --project=webkit --project=webkit-admin
              --project=webkit-mobile
    env:
      # Functional suite database; the visual suite uses e2e_visual on the same server
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      DATABASE_REPLICA_URLS: postgresql://postgres:postgres@localhost:5432/e2e
    runs-on: ubuntu-latest
    # WebKit's system dependencies alone can take 20+ minutes on a slow apt mirror
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" \
            docker-daemon:ekartoteka:e2e

      - name: Build mock services image
        run: docker compose -f docker-compose.e2e.yaml build mocks

      - name: Start application and database
        run: docker compose -f docker-compose.e2e.yaml up --no-build --wait --wait-timeout 180

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install ${{ matrix.browser }} --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Run E2E tests against the Docker image
        run: pnpm exec playwright test ${{ matrix.projects }}
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_VISUAL_BASE_URL: http://localhost:3001
          PLAYWRIGHT_INTEGRATIONS_BASE_URL: http://localhost:3002
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'

      - name: Show application logs
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yaml ps
          for service in ekartoteka ekartoteka-visual ekartoteka-integrations mocks; do
            docker inspect --format '{{json .State.Health}}' "$(docker compose -f docker-compose.e2e.yaml ps -q "$service")" || true
          done
          docker compose -f docker-compose.e2e.yaml logs

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
