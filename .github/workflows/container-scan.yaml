name: Container Scan

on:
  workflow_call:

jobs:
  container-scan:
    name: Run
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" \
            docker-daemon:ekartoteka:e2e

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ekartoteka:e2e
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy container results
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-container'
