name: Publish Docker Image

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Run
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ekartoteka-image
          path: ${{ runner.temp }}

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $TAGS; do
            skopeo copy --all --dest-creds "$REGISTRY_CREDS" \
              "oci-archive:${{ runner.temp }}/ekartoteka-image.tar" "docker://$tag"
          done
