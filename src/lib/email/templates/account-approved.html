<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twoje konto zostało zatwierdzone</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family:
        -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="border-collapse: collapse; background-color: #f1f5f9"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              width: 100%;
              border-collapse: separate;
              background-color: #ffffff;
              border: 1px solid #e2e8f0;
              border-radius: 8px;
            "
          >
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-bottom: 1px solid #e2e8f0;
                  font-size: 16px;
                  font-weight: 700;
                  color: #2563eb;
                "
              >
                ATU Ekartoteka
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <h1
                  style="
                    margin: 0 0 20px 0;
                    color: #0f172a;
                    font-size: 22px;
                    line-height: 1.3;
                    font-weight: 600;
                  "
                >
                  Twoje konto zostało zatwierdzone
                </h1>
                <p
                  style="
                    margin: 0 0 16px 0;
                    color: #0f172a;
                    font-size: 15px;
                    line-height: 1.6;
                  "
                >
                  Witaj{{NAME}},
                </p>
                <p
                  style="
                    margin: 0 0 16px 0;
                    color: #0f172a;
                    font-size: 15px;
                    line-height: 1.6;
                  "
                >
                  Administrator zatwierdził Twoje konto. Możesz teraz zalogować
                  się do systemu.
                </p>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="border-collapse: separate; margin: 8px 0 20px 0"
                >
                  <tr>
                    <td style="border-radius: 8px; background-color: #2563eb">
                      <a
                        href="{{LOGIN_URL}}"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          color: #f8fafc;
                          background-color: #2563eb;
                          border-radius: 8px;
                          text-decoration: none;
                          font-size: 15px;
                          font-weight: 600;
                        "
                        >Zaloguj się</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 0 0 20px 0;
                    color: #64748b;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Jeśli przycisk nie działa, skopiuj ten adres do
                  przeglądarki:<br /><a
                    href="{{LOGIN_URL}}"
                    style="color: #2563eb; word-break: break-all"
                    >{{LOGIN_URL}}</a
                  >
                </p>
                <p
                  style="
                    margin: 0 0 8px 0;
                    color: #64748b;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Dziękujemy za cierpliwość!
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 16px 0 0 0; color: #94a3b8; font-size: 12px">
            ATU Ekartoteka
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
